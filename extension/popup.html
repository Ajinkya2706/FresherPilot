<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FresherPilot Autofill</title>
    <style>
      :root { --bg: #ffffff; --panel: #f6f8fa; --text: #15202b; --muted: #5e6b7b; --line: #e1e5eb; --accent: #0f8a5f; --accent-ink: #fff; --warn: #8f6200; --warn-bg: #fcf2da; --bad: #b42318; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0f1720; --panel: #151f2a; --text: #e8eef5; --muted: #93a3b6; --line: #253040; --accent: #3fbf8a; --accent-ink: #052419; --warn: #f0c060; --warn-bg: #30270f; --bad: #ff8a80; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; width: 340px; font: 14px/1.45 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
      main { padding: 14px 16px 16px; display: grid; gap: 12px; }
      .hd { display: flex; align-items: center; gap: 10px; }
      .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font: 800 12px/28px "Segoe UI", sans-serif; text-align: center; }
      h1 { font-size: 15px; margin: 0; letter-spacing: -.01em; }
      .pill { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
      .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
      .pill.ok::before { background: var(--accent); } .pill.bad { color: var(--bad); } .pill.bad::before { background: var(--bad); }
      p { margin: 0; }
      .muted { color: var(--muted); font-size: 12px; }
      button { font: inherit; font-weight: 600; border-radius: 999px; padding: 10px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--text); transition: transform .1s, filter .15s; }
      button:hover:not(:disabled) { filter: brightness(.97); } button:active:not(:disabled) { transform: translateY(1px); }
      button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      button:disabled { opacity: .55; cursor: not-allowed; }
      button:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      label { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
      .result { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 10px 12px; display: grid; gap: 4px; }
      .result[hidden] { display: none; }
      .ok { color: var(--accent); font-weight: 600; }
      .warn { color: var(--warn); }
      .notice { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 8px 10px; font-size: 12px; }
      .notice[hidden] { display: none; }
      .err { color: var(--bad); font-size: 12px; }
      a { color: var(--accent); }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      input[type=text] { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: 12px; }
      details summary { cursor: pointer; font-size: 12px; color: var(--muted); }
      .foot { display: flex; gap: 12px; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <div class="hd"><span class="logo" aria-hidden="true">JF</span><h1>FresherPilot</h1><span id="pill" class="pill">Checking…</span></div>
      <p id="server" class="muted">Checking the FresherPilot app…</p>
      <p id="missing" class="notice" hidden></p>
      <button id="fill" class="primary" type="button">Fill this page</button>
      <label><input type="checkbox" id="overwrite" /> Also replace fields that already have text</label>
      <div id="result" class="result" hidden></div>
      <div class="row">
        <button id="applied" type="button" hidden>Mark this job as applied</button>
      </div>
      <p class="muted">Green outline = filled, orange = needs you. For multi-step forms click Fill on each step. Nothing is submitted for you. Shortcut: Alt+Shift+F.</p>
      <div class="foot"><a id="openApp" href="#">Open FresherPilot</a><a id="openProfile" href="#">Edit profile</a></div>
      <details>
        <summary>Settings</summary>
        <p class="muted" style="margin:6px 0 4px">FresherPilot app address</p>
        <input id="serverUrl" type="text" placeholder="http://localhost:8000" />
      </details>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
