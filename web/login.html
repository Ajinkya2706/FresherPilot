<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · FresherPilot</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c6cff'/%3E%3Cstop offset='1' stop-color='%2335d0ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M17 6 9 18h6l-1 8 8-12h-6z' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>try{var t=JSON.parse(localStorage.getItem("fp.theme"));if(t)document.documentElement.dataset.theme=t;else if(matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.dataset.theme="light"}catch(e){}</script>
    <link rel="stylesheet" href="/static/css/fp.css" />
    <link rel="stylesheet" href="/static/css/motion.css" />
  </head>
  <body>
    <main class="auth">
      <form class="card auth-card" id="form" novalidate>
        <a class="brand" href="/"><span class="logo"><svg viewBox="0 0 24 24"><path d="M12 3 4 14h6l-1 7 9-12h-6z"/></svg></span><span><b>FresherPilot</b><small>Never miss a job</small></span></a>
        <div><h1 id="heading">Sign in</h1><p class="muted" id="sub" style="margin-top:6px">Your jobs, matched to your resume.</p></div>
        <div id="googleBox" hidden><div id="google" style="display:flex;justify-content:center;min-height:44px"></div><p class="faint xs center" style="margin-top:6px">Invite-only: use the email the owner invited.</p></div>
        <div class="or" id="divider" hidden>or</div>
        <label class="field"><span>Username</span><input class="input" id="username" autocomplete="username" required minlength="3" autofocus></label>
        <label class="field"><span>Password</span><input class="input" id="password" type="password" autocomplete="current-password" required minlength="8"></label>
        <label class="check" id="consentRow" hidden><input type="checkbox" id="consent"><span>I agree to the <a href="/terms" target="_blank">Terms</a> and the <a href="/privacy" target="_blank">Privacy Policy</a>, and I'm 18 or older.</span></label>
        <p class="msg bad" id="msg" role="alert" style="min-height:0"></p>
        <button class="btn primary lg" type="submit" id="submit">Sign in</button>
        <p class="center small muted" id="switchRow" hidden><span id="switchText">New here?</span> <button type="button" class="link" id="switchBtn">Create an account</button></p>
        <p class="faint xs center" id="note" hidden>The first account on this computer becomes the owner and keeps the existing jobs, profile and keys.</p>
        <p class="faint xs center"><a href="/terms">Terms</a> · <a href="/privacy">Privacy</a></p>
      </form>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      let mode = "login", pendingCredential = null;
      function setMode(m) {
        mode = m; const reg = m === "register";
        $("heading").textContent = reg ? "Create your account" : "Sign in"; $("submit").textContent = reg ? "Create account" : "Sign in";
        $("switchText").textContent = reg ? "Already have an account?" : "New here?"; $("switchBtn").textContent = reg ? "Sign in" : "Create an account";
        $("password").autocomplete = reg ? "new-password" : "current-password"; $("consentRow").hidden = !reg; $("msg").textContent = "";
      }
      async function post(url, body) { const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); return { res, data: await res.json().catch(() => ({})) }; }
      async function googleSignIn(credential) {
        $("msg").textContent = ""; const { res, data } = await post("/api/auth/google", { credential, consent: $("consent").checked });
        if (res.status === 428) {
          pendingCredential = credential; setMode("google-consent"); $("heading").textContent = "Create your account"; $("consentRow").hidden = false;
          for (const id of ["username", "password"]) { $(id).required = false; $(id).closest("label").hidden = true; }
          $("switchRow").hidden = true; $("submit").textContent = "Continue with Google"; $("msg").textContent = data.detail; return;
        }
        if (!res.ok) return ($("msg").textContent = data.detail || "Google sign-in failed"); location.href = data.next || "/";
      }
      fetch("/api/auth/state").then((r) => r.json()).then((s) => {
        if (!s.has_accounts) { setMode("register"); $("note").hidden = false; }
        else if (s.local_mode) $("sub").textContent = "Sign in once on this computer; after that the app opens without asking.";
        $("switchRow").hidden = !s.password_signup;
        if (s.google_client_id) {
          const sc = document.createElement("script"); sc.src = "https://accounts.google.com/gsi/client"; sc.async = true;
          sc.onload = () => { google.accounts.id.initialize({ client_id: s.google_client_id, callback: (r) => googleSignIn(r.credential) }); google.accounts.id.renderButton($("google"), { theme: "outline", size: "large", width: 320, text: "continue_with" }); };
          document.head.appendChild(sc); $("googleBox").hidden = false; $("divider").hidden = false;
        }
      });
      $("switchBtn").onclick = () => setMode(mode === "login" ? "register" : "login");
      $("form").onsubmit = async (e) => {
        e.preventDefault();
        if (mode === "google-consent") { if (!$("consent").checked) return ($("msg").textContent = "Please tick the box to accept the Terms and Privacy Policy."); return googleSignIn(pendingCredential); }
        if (mode === "register" && !$("consent").checked) return ($("msg").textContent = "Please accept the Terms and Privacy Policy.");
        $("submit").classList.add("busy"); $("msg").textContent = "";
        try {
          const { res, data } = await post(`/api/auth/${mode}`, { username: $("username").value, password: $("password").value, consent: $("consent").checked });
          if (!res.ok) throw new Error(data.detail || "Something went wrong"); location.href = data.next || "/";
        } catch (err) { $("msg").textContent = err.message; } finally { $("submit").classList.remove("busy"); }
      };
    </script>
  </body>
</html>
